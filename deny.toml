# cargo-deny: supply-chain policy enforced in CI (job `deny`).
# Licenses: permissive only — the workspace ships MIT and must not embed
# copyleft or unknown-license code. Advisories: RustSec v2 DB, yanked
# crates refused. Sources: crates.io only, no ad-hoc git dependencies.

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[advisories]
version = 2
yanked = "deny"
# smartstring 1.0.1 is unmaintained (RUSTSEC-2026-0249, repo archived
# 2026-05-03). It is transitive via rhai 1.27 (the CodeMode interpreter,
# W5.9): every rhai release pulls it and no maintained drop-in
# interpreter has been verified from vendored source, so the dependency
# stays and the advisory carries this documented ignore. This is the
# ONE advisory ignore in the tree -- no vulnerability is ignored.
ignore = ["RUSTSEC-2026-0249"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
