[workspace]
resolver = "2"
members = [
    "crates/marfim-core",
    "crates/marfim-tools",
    "crates/marfim-mcp",
    "crates/marfim-gateway",
    "crates/marfim-brain",
    "crates/marfim",
]

[workspace.package]
version = "0.3.0"
rust-version = "1.78"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/0x0nYx/Marfim"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "io-util", "net", "time", "sync", "fs", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
futures-util = "0.3"
regex = "1"
async-trait = "0.1"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Constrained-environment hygiene: line-tables-only debuginfo keeps the
# dev target dir ~10x smaller; debugging still has stack traces.
[profile.dev]
debug = "line-tables-only"
