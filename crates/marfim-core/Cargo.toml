[package]
name = "marfim-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Marfim core: event bus, agent loop, providers, router, permissions, sessions"

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures-util.workspace = true
regex.workspace = true
async-trait.workspace = true
toml.workspace = true

# Safe process-group signalling (kill(2) on the negative pgid) for Linux+macOS.
# marfim-core forbids unsafe code, so libc is wrapped via nix's safe API.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# D10: outbound bodies are validated against the vendored wire schemas.
jsonschema = { version = "0.26", default-features = false }
