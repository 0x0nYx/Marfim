[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marfim"
version = "0.1.0"
description = "Marfim — unified coding-agent harness synthesized (clean-room) from opencode v2, Codex, Goose, Aider, Claude Code, Hermes, Oh My Pi, dsh-superagent, REA and ECC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marfim contributors" }]
keywords = ["ai", "agent", "coding-agent", "cli", "harness", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["build", "twine"]

[project.scripts]
marfim = "marfim.cli:main"

[tool.setuptools.packages.find]
include = ["marfim*"]

[tool.setuptools.package-data]
marfim = ["py.typed"]
