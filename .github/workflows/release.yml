name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: marfim-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: marfim-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build static binary
        env:
          CARGO_INCREMENTAL: 0
        run: cargo build --release --target ${{ matrix.target }} -p marfim
      - name: Collect artifact + checksum
        run: |
          cp "target/${{ matrix.target }}/release/marfim" "${{ matrix.artifact }}"
          sha256sum "${{ matrix.artifact }}" >> SHA256SUMS.txt || shasum -a 256 "${{ matrix.artifact }}" >> SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            SHA256SUMS.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/marfim-*
            dist/SHA256SUMS.txt
