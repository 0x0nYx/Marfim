name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (incl. wire-golden differentials, loopback only)
        run: cargo test --all
      - name: Release binary + size budget
        run: |
          cargo build --release
          SIZE=$(stat -c%s target/release/marfim)
          echo "binary size: $SIZE bytes"
          test "$SIZE" -lt 26214400  # <25 MB
      - name: CLI smoke
        run: |
          ./target/release/marfim --version
          ./target/release/marfim doctor
          ./target/release/marfim -p "hello" --output-format json

  python:
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e .
      - name: Unit + integration tests
        run: python -m unittest discover -s tests -v
      - name: Doctor smoke (offline-safe)
        run: marfim doctor || true
        env:
          MARFIM_HOME: ${{ github.workspace }}/.marfim-home
