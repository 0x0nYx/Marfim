name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - env:
          CARGO_INCREMENTAL: 0
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (incl. wire-golden differentials, loopback only)
        run: cargo test --all
      - name: Release binary + size budget
        run: |
          cargo build --release
          SIZE=$(stat -c%s target/release/marfim)
          echo "binary size: $SIZE bytes"
          test "$SIZE" -lt 26214400  # <25 MB
      - name: CLI smoke
        run: |
          ./target/release/marfim --version
          ./target/release/marfim doctor
          ./target/release/marfim sessions || true

